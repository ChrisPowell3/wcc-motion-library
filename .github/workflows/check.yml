name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: rm -rf dist
      - run: npm run build
      - name: Verify committed build is up to date
        run: |
          git add --intent-to-add dist
          git diff --exit-code dist
