name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Remove generated output before rebuilding
        run: rm -rf dist
      - run: npm run build
      - name: Verify committed dist is current
        run: |
          git diff --exit-code dist
          test -z "$(git ls-files --others --exclude-standard dist)"
      - name: Verify the built package imports without a loader
        run: >-
          node --input-type=module -e 'import { ScrollRevealRise } from "@wcc/motion-library";
          if (typeof ScrollRevealRise !== "function") throw new Error("ScrollRevealRise did not resolve");'
